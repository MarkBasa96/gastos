<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Gastos</title>
    <meta name="description" content="Know where your money went, in two taps a day." />
    <meta name="author" content="Joemark Basa" />
    <!-- Home-screen app: own icon, own name, no browser bar -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Splash rule (Erina v2 §5): the resting background, so opening has no colour flash -->
    <!-- Gastos has its own light and dark. Without this, Chrome's auto dark mode repaints the page:
         light turned dark and the MPIN dots went grey on Joe's phone (v3 test, 2026-09-28). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F7F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      :root {
        color-scheme: light dark;
      }
      /* White before the app draws: continues Android's white splash into the logo screen (v3). */
      html,
      body {
        height: 100%;
        background-color: #FFFFFF;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
