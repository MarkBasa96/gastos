<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../assets/fonts/Inter_400Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../assets/fonts/Inter_500Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../assets/fonts/Inter_600SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../assets/fonts/Inter_700Bold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(../../../assets/fonts/Poppins_700Bold.ttf)}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);position:relative;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
svg.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:absolute;inset:0;overflow:hidden}
.page{padding:4px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.h18{font-size:18px;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500}
.hero{position:relative;border-radius:20px;border:1px solid var(--glassBorder);overflow:hidden;padding:16px 18px 16px}
.hero.shadow{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mesh{position:absolute;inset:0}
.hero .glass{position:absolute;inset:0;background:var(--glass)}
.hero .c{position:relative}
.hero .lbl{font-size:14px;font-weight:600}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:38px;margin-top:2px}
.hero .sub{display:flex;gap:16px;margin-top:6px;font-size:13px;font-weight:600}
.hero .sub span{display:flex;align-items:center;gap:4px}
.seg{display:flex;width:200px;border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;background:var(--surface)}
.seg div{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--muted)}
.seg .on{background:var(--accentSoft);color:var(--text);font-weight:600}
.label{font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 8px}
.field{height:48px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px}
.field.big{height:60px}
.field .sym{font-size:26px;font-weight:600;color:var(--muted)}
.field .amt{font-size:32px;font-weight:700;color:var(--muted)}
.field .amt.v{color:var(--text)}
.field.focus{border:2px solid var(--accent);padding:0 13px}
.ph{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:58px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);position:relative}
.tile b{font-size:13px;font-weight:500;color:var(--text);max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.tile.on b{font-weight:600}
.tile .pen{position:absolute;top:5px;right:6px;color:var(--accent)}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{height:42px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:15px;font-weight:500;color:var(--muted)}
.chip span{color:var(--text)}
.note{margin-top:12px;min-height:50px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accentSoft);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--accent)}
.note .t{font-size:15px;font-weight:500;color:var(--text);flex:1}
.note .t.ph{color:var(--noteHint)}
.note .opt{font-size:12px;font-weight:600;color:var(--accent);opacity:.9}
.saverow{display:flex;gap:10px;margin-top:12px;align-items:center}
.pig{width:52px;height:52px;border-radius:12px;background:var(--accentSoft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.btn{flex:1;height:52px;border-radius:12px;background:var(--accent);color:var(--accentText);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.btn.out{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;font-size:16px}
.other{margin-top:10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:12px}
.other .q{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.other .hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:17px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:500}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.nav{position:absolute;left:12px;right:12px;bottom:12px;height:60px;border-radius:20px;border:1px solid var(--navBorder);border-top-color:var(--navTop);background:var(--nav);display:flex;backdrop-filter:blur(13px) saturate(140%)}
.nav.shadow{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:15px;font-weight:500;color:var(--muted)}
.nav div i{display:block;height:3px;width:18px;border-radius:2px}
.nav .on{color:var(--accent);font-weight:600}
.nav .on i{background:var(--accent)}
.credit{position:absolute;right:15px;bottom:2px;background:#4a4f4c;color:#fff;font:700 10.5px Poppins,sans-serif;padding:4px 10px;border-radius:12px;opacity:.95}
/* popups: blur + lighter scrim (new) */
.veil{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(9px) saturate(120%);-webkit-backdrop-filter:blur(9px)}
.dialog{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{font-size:20px;font-weight:700}
.prev{margin-top:14px;border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.prev .ic{width:40px;height:40px;border-radius:12px;background:var(--bgAlt);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.prev .m{flex:1;min-width:0}
.prev .m b{font-size:15px;font-weight:600;display:block}
.prev .m s{text-decoration:none;font-size:13px;color:var(--muted)}
.dialog .n{display:flex;gap:5px;align-items:center;font-size:13px;font-weight:500;color:var(--accent);background:var(--accentSoft);padding:8px 10px;border-radius:10px}
.prev .a{font-size:15px;font-weight:700}
.row2{display:flex;gap:10px;margin-top:18px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700}
.sheet .st{font-size:14px;color:var(--muted);margin-top:4px;line-height:20px}
.card{border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:62px;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-size:17px;font-weight:400}
.srow .m s{text-decoration:none;display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sec{font-size:15px;font-weight:600;color:var(--muted);margin:22px 0 10px 2px}
.new{background:var(--accent);color:var(--accentText);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.3px}
.dots{display:flex}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.apseg{display:flex;border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.apseg div{width:40px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.apseg .on{background:var(--accentSoft);color:var(--accent)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--accent);position:relative}
.toggle:after{content:'';position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.th{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:8px;position:relative}
.th.on{border:2px solid var(--accent);padding:7px}
.th .mini{height:54px;border-radius:11px;position:relative;overflow:hidden;padding:8px 10px}
.th .mini b{position:relative;display:block;font-size:15px;font-weight:700}
.th .mini .bar{position:relative;margin-top:5px;height:10px;width:56px;border-radius:5px}
.th .nm{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px;font-size:14px;font-weight:600}
.th .sw{display:flex;gap:3px}.th .sw i{width:12px;height:12px;border-radius:50%}
.th .ck{position:absolute;top:13px;right:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.faq .q{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--border);font-size:15.5px;font-weight:600}
.faq .q:first-child{border-top:0}
.faq .q span{flex:1}
.faq .ans{padding:0 16px 14px 16px;font-size:14.5px;line-height:21px;color:var(--muted);font-weight:400}
.faq .open{background:var(--accentSoft)}
.search{height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:15px;margin-top:14px}
.odlg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.odlg h3{font-size:20px;font-weight:700}
.olab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 8px}
.obox{position:relative;height:266px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg)}
.orow{display:flex;align-items:center;gap:12px;height:48px;padding:0 22px 0 14px;border-top:1px solid var(--border);font-size:16px;color:var(--text)}
.orow:first-child{border-top:0}
.orow .ic{color:var(--muted);display:flex}
.orow.on{background:var(--accentSoft);font-weight:600}
.orow.on .ic{color:var(--accent)}
.orow mark{background:transparent;color:var(--accent);font-weight:700}
.otrack{position:absolute;top:6px;bottom:6px;right:5px;width:6px;border-radius:3px;background:var(--border);opacity:.7}
.othumb{position:absolute;right:5px;width:6px;border-radius:3px;background:var(--muted)}
.oadd{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1.5px solid var(--accent);border-radius:14px;background:var(--accentSoft);color:var(--accent);font-size:16px;font-weight:600;margin-top:12px}
.opin{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.75}
.opin.on{color:var(--accent);background:var(--accentSoft);opacity:1}
.osec{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 14px 5px;background:var(--bg)}
.oempty{font-size:14px;color:var(--muted);padding:14px}
.backhint{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:22px;white-space:nowrap}

const ic = (n, s=20, w=1.8, extra='') => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" stroke-width="${w}" ${extra}>${IC[n]}</svg>`;

function mesh(c, o){
  return `<svg class="mesh" width="100%" height="100%" viewBox="0 0 358 124" preserveAspectRatio="none"><defs>
  ${c.map((col,i)=>`<radialGradient id="g${i}${col.slice(1)}"><stop offset="0" stop-color="${col}" stop-opacity="${o[i]}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`).join('')}</defs>
  <ellipse cx="43" cy="6" rx="222" ry="136" fill="url(#g0${c[0].slice(1)})"/><ellipse cx="340" cy="130" rx="197" ry="124" fill="url(#g1${c[1].slice(1)})"/><ellipse cx="258" cy="0" rx="93" ry="77" fill="url(#g2${c[2].slice(1)})"/></svg>`;
}
const hero = () => `<div class="hero ${V.dark?'':'shadow'}">${mesh(V.mesh,V.mo)}<div class="glass"></div><div class="c">
  <div class="lbl">Left this month</div><div class="big">₱7,713.72</div>
  <div class="sub"><span>${ic('ur',15,2.2)}In ₱14,250.00</span><span>${ic('dr',15,2.2)}Out ₱6,536.28</span></div></div></div>`;
const nav = (on) => `<div class="nav ${V.dark?'':'shadow'}">${['Log','History','Settings'].map(x=>`<div class="${x===on?'on':''}">${x}<i></i></div>`).join('')}</div><div class="credit">© Joemark Basa</div>`;

const CATS = [['Food','utensils'],['Transport','bus'],['Load','phone'],['Bills','receipt'],['Padala','send'],['Shopping','bag'],['Health','heart'],['Other','dots']];

function log(o={}){
  const tiles = CATS.map(([c,i])=>{
    const on = o.cat===c; let label = c, icon=i, pen='';
    if(c==='Other' && (o.other||o.picked)){ label = o.other||o.picked; pen = `<span class="pen">${ic('pen',11,2.2)}</span>`; }
    return `<div class="tile ${on?'on':''}">${pen}${ic(icon,20)}<b>${label}</b></div>`;
  }).join('');
  const otherBox = o.other ? `<div class="other">
      <div class="q">${ic('pen',15,2,'style="color:var(--accent)"')}What was it?</div>
      <div class="field focus"><span style="flex:1">${o.other}</span><span style="width:1.5px;height:20px;background:var(--accent);margin-right:auto"></span>${ic('x',16,2,'style="color:var(--muted)"')}</div>
      <div class="check"><div class="box on">${ic('check',14,3)}</div>Keep “${o.other}” as a tile for next time</div>
    </div>` : '';
  const noteBox = o.note
    ? `<div class="note">${ic('note',20,2)}<span class="t">${o.note}</span>${ic('pen',16,2)}</div>`
    : `<div class="note">${ic('note',20,2)}<span class="t ph">Add a note, like “Jollibee lunch”</span><span class="opt">Optional</span></div>`;
  const amt = o.amt ? `<span class="amt v">${o.amt}</span>` : `<span class="amt">0.00</span>`;
  return `<div class="screen"><div class="page" style="${o.scroll?`transform:translateY(-${o.scroll}px)`:''}">
    <div class="top"><div class="h18">September</div><div class="sync">${ic('phone',13,2)}This phone only</div></div>
    ${hero()}
    <div style="margin-top:16px" class="seg"><div class="on">Expense</div><div>Income</div></div>
    <div class="label">Amount</div>
    <div class="field big"><span class="sym">₱</span>${amt}</div>
    <div class="label">What for?</div>
    <div class="grid">${tiles}</div>
    ${otherBox}
    <div class="chips"><div class="chip">${ic('wallet',16)}<span>${o.wallet||'Cash'}</span>${ic('down',14)}</div><div class="chip">${ic('cal',16)}<span>Today</span>${ic('down',14)}</div></div>
    ${noteBox}
    <div class="saverow"><div class="pig">${ic('pig',26,1.8)}</div><div class="btn">${o.amt?'Save ₱'+o.amt:'Save'}</div></div>
  </div>${nav('Log')}${o.backhint?'<div class="backhint">Press back again to exit</div>':''}</div>`;
}

function settings(){
  const sw = ['green','pink','lavender','ocean','coral'].map(k=>`<i style="background:${THEMES[k][MODE==='dark'?'D':'L'].accent}"></i>`).join('');
  return `<div class="screen"><div class="page" style="padding-top:18px">
   <div style="font-size:32px;font-weight:700;letter-spacing:-.5px">Settings</div>
   <div class="card" style="margin-top:16px"><div class="srow"><div class="m"><b style="font-weight:600">Signed in</b><s>j•••••@gmail.com · Synced</s></div><div class="sync"><i style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:block"></i></div></div></div>
   <div class="sec">Preferences</div>
   <div class="card">
     <div class="srow"><div class="m"><b>Appearance</b><s>Always ${MODE}</s></div><div class="apseg"><div>${ic('sunmoon',18)}</div><div class="${MODE==='light'?'on':''}">${ic('sun',18)}</div><div class="${MODE==='dark'?'on':''}">${ic('moon',18)}</div></div></div>
     <div class="srow"><div class="m"><b style="display:flex;align-items:center;gap:8px">Color theme <span class="new">NEW</span></b><s>${THEMES[TH].name}</s></div><div class="dots" style="margin-right:4px">${sw}</div><span style="color:var(--muted)">${ic('right',18)}</span></div>
     <div class="srow"><div class="m"><b>Currency</b><s>Converts amounts at today’s rate</s></div><div class="chip" style="font-weight:600"><span>₱ PHP</span>${ic('down',14)}</div></div>
     <div class="srow"><div class="m"><b>Sounds</b><s>Coin clink when you save</s></div><div class="toggle"></div></div>
   </div>
   <div class="sec">Help</div>
   <div class="card">
     <div class="srow"><span style="color:var(--accent)">${ic('help',22)}</span><div class="m"><b style="display:flex;align-items:center;gap:8px">FAQ <span class="new">NEW</span></b><s>Quick answers about Gastos</s></div><span style="color:var(--muted)">${ic('right',18)}</span></div>
     <div class="srow"><span style="color:var(--accent)">${ic('msg',22)}</span><div class="m"><b>Send feedback</b><s>Goes straight to the developer</s></div><span style="color:var(--muted)">${ic('right',18)}</span></div>
   </div>
  </div>${nav('Settings')}</div>`;
}

function themeSheet(){
  const cards = Object.entries(THEMES).map(([k,th])=>{
    const vv = vars(k, MODE), on = k===TH;
    return `<div class="th ${on?'on':''}"><div class="mini" style="background:${vv.bg}">${mesh(vv.mesh,vv.mo)}<div style="position:absolute;inset:0;background:${vv.glass}"></div>
      <b style="color:${vv.text}">₱7,713</b><div class="bar" style="background:${vv.accent}"></div></div>
      ${on?`<div class="ck" style="background:var(--accent);color:var(--accentText)">${ic('check',14,3)}</div>`:''}
      <div class="nm">${th.name}</div></div>`;
  }).join('');
  return `<div class="veil"></div><div class="sheet"><div class="grab"></div>
    <h3>Color theme</h3><div class="st">Pick the color you like. Light and dark both follow it. Only changes this phone.</div>
    <div class="themes">${cards}</div></div>`;
}

const FAQ = [
 ['Where are my entries saved?', 'On this phone first, so Gastos works with no signal. If you sign in, they also back up to your account and show on your other phones.'],
 ['What does “3 waiting” mean?', ''], ['I forgot my MPIN. What do I do?', ''], ['Can I use Gastos with no internet?', ''],
 ['How do I edit or delete an entry?', ''], ['How do I add my own category?', ''], ['How do I change the color?', ''],
];
function faqSheet(){
  const rows = FAQ.map(([q,a],i)=> i===0
    ? `<div class="open"><div class="q"><span>${q}</span><span style="flex:none;color:var(--accent)">${ic('up',18)}</span></div><div class="ans">${a}</div></div>`
    : `<div class="q"><span>${q}</span><span style="flex:none;color:var(--muted)">${ic('down',18)}</span></div>`).join('');
  return `<div class="veil"></div><div class="sheet" style="top:70px"><div class="grab"></div>
   <h3>FAQ</h3><div class="st">Quick answers about Gastos. Still stuck? Send feedback from Settings.</div>
   <div class="search">${ic('search',17)}Search questions</div>
   <div class="card faq" style="margin-top:12px">${rows}</div></div>`;
}

// Most used first (Joe v3.1 round 2); pinned ones sit on top whatever their use.
const MYLIST = ['Haircut','Tuition','Laundry','Condo dues','Cooking gas','Gym','Pets','Gifts','Rent','Netflix','Coffee','Parking'];
const PINNED = ['Coffee','Parking'];
function otherDlg(q, typed){
  const ql = (q||'').toLowerCase();
  const match = n => !ql || n.toLowerCase().includes(ql);
  const pinned = PINNED.filter(match), rest = MYLIST.filter(n => !PINNED.includes(n) && match(n));
  const hl = n => { if(!ql) return n; const i=n.toLowerCase().indexOf(ql); return n.slice(0,i)+'<mark>'+n.slice(i,i+ql.length)+'</mark>'+n.slice(i+ql.length); };
  const row = (n, on) => `<div class="orow"><span class="ic">${ic('tag',18)}</span><span style="flex:1">${hl(n)}</span><span class="opin ${on?'on':''}">${ic('pin',17,2,on?'fill="currentColor"':'')}</span></div>`;
  let rows = '';
  if (pinned.length) rows += `<div class="osec">Pinned</div>` + pinned.map(n => row(n, true)).join('');
  if (rest.length) rows += `<div class="osec">${ql ? 'In your list' : 'Most used'}</div>` + rest.map(n => row(n, false)).join('');
  const total = pinned.length + rest.length;
  const scroll = total > 4;
  const thumbH = scroll ? Math.max(40, Math.round(254 * 4.6 / (total + 1.5))) : 0;
  const field = `<div class="field focus" style="margin-top:14px">${ic('search',18,2,'style="color:var(--muted)"')}<span style="flex:1;${q?'':'color:var(--muted)'}">${q||'Search, or type a new one'}</span>${q?`<span style="width:1.5px;height:20px;background:var(--accent)"></span>${ic('x',16,2,'style="color:var(--muted)"')}`:''}</div>`;
  const add = typed ? `<div class="oadd">${ic('plus',18,2.2)}<span style="flex:1">Use “${q}”</span></div>
     <div class="check" style="margin:10px 2px 0"><div class="box on">${ic('check',14,3)}</div>Save “${q}” to my list</div>` : '';
  const list = total
    ? `<div class="olab"><span>Your list · tap ${ic('pin',12,2.2,'style="vertical-align:-1px"')} to keep one on top</span><span>${total}</span></div><div class="obox">${rows}${scroll?`<div class="otrack"></div><div class="othumb" style="top:6px;height:${thumbH}px"></div>`:''}</div>`
    : `<div class="olab"><span>Your list</span></div><div class="obox" style="height:auto"><div class="oempty">Nothing in your list matches “${q}”.</div></div>`;
  return `<div class="veil"></div><div class="odlg"><h3>What was it?</h3>${field}${add}${list}
    <div class="row2"><div class="btn out">Cancel</div><div class="btn" style="font-size:16px;${typed?'':'opacity:.45'}">Done</div></div></div>`;
}

function confirmDlg(){
  return `<div class="veil"></div><div class="dialog"><h3>Save this expense?</h3>
   <div class="prev"><div class="ic">${ic('dots',20)}</div><div class="m"><b>Haircut</b><s>Cash · Today</s></div><div class="a">−₱150.00</div></div><div class="n" style="margin-top:10px">${ic('note',14,2)}Barber near the office</div>
   <div class="row2"><div class="btn out">Cancel</div><div class="btn" style="font-size:16px">Save it</div></div></div>`;
}

let html = '';
if (S==='log') html = log();
else if (S==='other') html = log({cat:'Other', other:'Haircut', amt:'150', note:'Barber near the office', scroll:150});
else if (S==='confirm') html = log({cat:'Other', other:'Haircut', amt:'150', note:'Barber near the office', scroll:150}) + confirmDlg();
else if (S==='filled') html = log({cat:'Food', amt:'185', note:'Jollibee lunch', wallet:'GCash'});
else if (S==='back') html = log({backhint:true});
else if (S==='grid8') html = log({cat:'Other', picked:'Coffee', amt:'120', note:'Iced latte'});
else if (S==='olist') html = log({cat:'Other', amt:'120'}) + otherDlg('', false);
else if (S==='osearch') html = log({cat:'Other', amt:'120'}) + otherDlg('co', false);
else if (S==='onew') html = log({cat:'Other', amt:'40'}) + otherDlg('Tricycle', true);
else if (S==='settings') html = settings();
else if (S==='themes') html = settings() + themeSheet();
else if (S==='faq') html = settings() + faqSheet();
document.body.innerHTML = html;
</script></body></html>
